{% extends 'base.html' %}
{% load static %}

{% block title %}Password Updated | JOFA{% endblock %}

{% block content %}
<section class="py-32 bg-jofa-beige flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md bg-white p-12 shadow-2xl rounded-sm border-t-4 border-jofa-gold text-center">
        <div class="mb-10 text-green-500">
            <svg class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <h1 class="text-3xl serif text-jofa-onyx mb-6 uppercase tracking-widest">Password Reset</h1>
        <p class="text-sm text-gray-500 mb-10">
            Your password has been successfully updated. You can now use your new password to sign in to your account.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn-gold block py-4 uppercase text-xs tracking-widest font-bold shadow-xl">
            Login Now
        </a>
    </div>
</section>
{% endblock %}
