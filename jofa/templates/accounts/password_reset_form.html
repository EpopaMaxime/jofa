{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | JOFA{% endblock %}

{% block content %}
<section class="py-32 bg-jofa-beige flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md bg-white p-12 shadow-2xl rounded-sm border-t-4 border-jofa-gold">
        <div class="text-center mb-10">
            <h1 class="text-3xl serif text-jofa-onyx mb-4 uppercase tracking-widest">Reset Password</h1>
            <p class="text-[10px] uppercase tracking-widest font-black text-gray-400">Enter your email address below</p>
        </div>
        
        <form method="post" class="space-y-8">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] uppercase tracking-widest font-black text-jofa-onyx mb-3">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full border border-gray-100 p-4 font-light text-sm outline-none focus:border-jofa-gold transition-colors">
                {% if form.email.errors %}
                <p class="text-red-500 text-[9px] mt-2 font-bold uppercase tracking-widest">{{ form.email.errors.0 }}</p>
                {% endif %}
            </div>
            
            <button type="submit"
                class="w-full btn-gold py-4 uppercase text-xs tracking-widest font-bold shadow-xl">Send Reset Link</button>
        </form>
        
        <div class="mt-10 text-center">
            <a href="{% url 'accounts:login' %}" class="text-[10px] uppercase tracking-widest font-bold text-gray-400 hover:text-jofa-onyx transition-colors">
                Back to Login
            </a>
        </div>
    </div>
</section>
{% endblock %}
