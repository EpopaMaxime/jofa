{% extends 'base.html' %}
{% load static %}

{% block title %}Email Sent | JOFA{% endblock %}

{% block content %}
<section class="py-32 bg-jofa-beige flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md bg-white p-12 shadow-2xl rounded-sm border-t-4 border-jofa-gold text-center">
        <div class="mb-10 text-jofa-gold">
            <svg class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1 class="text-3xl serif text-jofa-onyx mb-6 uppercase tracking-widest">Check Your Email</h1>
        <p class="text-sm text-gray-500 leading-relaxed mb-10">
            We've sent a password reset link to your email address. If it doesn't appear in a few minutes, please check your spam folder.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn-gold block py-4 uppercase text-xs tracking-widest font-bold shadow-xl">
            Return to Login
        </a>
    </div>
</section>
{% endblock %}
