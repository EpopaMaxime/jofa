{% extends 'base.html' %}

{% block title %}Store profile | Seller{% endblock %}

{% block content %}
<section class="py-16 bg-jofa-beige">
    <div class="container mx-auto px-6 md:px-12 max-w-2xl">
        <h1 class="text-3xl serif mb-8">Store profile</h1>
        {% include 'vendors/_nav.html' %}
        <form method="post" enctype="multipart/form-data" class="bg-white/40 border border-gray-200 p-8 space-y-5 shadow-xl">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-[10px] uppercase tracking-widest font-bold mb-2">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button class="btn-gold w-full py-4 uppercase text-xs tracking-widest">Save profile</button>
        </form>
    </div>
</section>
<style>
    form input, form textarea, form select {
        width: 100%; border: 1px solid #d1d5db; padding: 0.85rem 1rem; background: #F3EBE5; font-size: 0.875rem;
    }
</style>
{% endblock %}
